<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pears Garden Homestay</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraham/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a direct hit on any
      // route other than "/" (e.g. a refresh, or a shared link) lands here.
      // Re-encode the path into a query string and bounce to index.html,
      // which decodes it back before React Router ever sees it.
      var pathSegmentsToKeep = 1; // keep "/Pears-Garden"

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
